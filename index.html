/* Screenshot-guided app surfaces: clean, bright iOS/Kakao layout */
#appContent:has(.kakao-shell){padding:0;background:#f7f7f7}
.kakao-shell{height:100%;display:flex;flex-direction:column;background:#f7f7f7;color:#191919;min-height:0}
.kakao-top{height:54px;flex-shrink:0;display:flex;align-items:center;gap:13px;padding:0 17px;background:#fff}
.kakao-top .kakao-title{font-size:22px;font-weight:750;flex:1}
.kakao-top button{border:0;background:transparent;color:#222;font-size:23px;padding:3px;line-height:1}
.kakao-filter{display:flex;gap:7px;align-items:center;padding:5px 16px 10px;background:#fff;flex-shrink:0}
.kakao-filter span{border-radius:22px;padding:8px 15px;background:#f1f1f1;color:#555;font-size:12px;font-weight:650}
.kakao-filter span:first-child{background:#191919;color:#fff}
.kakao-list{flex:1;overflow:auto;background:#fff;padding:0 15px;min-height:0}
.kakao-row{width:100%;display:flex;align-items:center;gap:11px;padding:12px 0;border:0;border-bottom:1px solid #f0f0f0;background:#fff;text-align:left;color:#191919}
.kakao-row .avatar{width:49px;height:49px;border-radius:17px;border:0;background:#f1f1f1}
.kakao-row .chatname{font-size:14px;font-weight:650}
.kakao-row .preview{font-size:12px;color:#999;margin-top:4px}
.kakao-row .time{font-size:10px;color:#888;white-space:nowrap}
.kakao-bottom{height:56px;flex-shrink:0;display:flex;justify-content:space-around;align-items:center;background:#fff;border-top:1px solid #eee;padding-bottom:3px}
.kakao-bottom button{border:0;background:transparent;color:#b7b9bd;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px}
.kakao-bottom button.selected{color:#262626}
.kakao-bottom small{font-size:9px}
.kakao-empty{flex:1;display:grid;place-items:center;background:#f7f7f7;color:#ddd;font-size:26px;font-weight:800;letter-spacing:-1px}
.kakao-empty span{background:#e4e4e4;color:white;border-radius:60% 60% 55% 55%;padding:26px 18px;position:relative}
.kakao-empty span:after{content:"";position:absolute;bottom:-9px;left:24px;border-width:13px 9px 0 0;border-style:solid;border-color:#e4e4e4 transparent transparent transparent;transform:rotate(15deg)}
/* Keep chat messages in the established room; incoming bubbles append to the bottom. */
.chatroom{min-height:0}

function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(el._timer);el._timer=setTimeout(()=>el.style.display='none',2400)}
function openApp(name){if(!state.unlocked){$('#lock').style.display='none';$('#passpanel').style.display='flex';return}state.app=name;$('#home').classList.remove('show');$('#appview').classList.add('active');$('#appTitle').textContent=({kakao:'카카오톡',phone:'전화',contacts:'연락처',gallery:'사진',x:'X',calendar:'캘린더',camera:'카메라',facetime:'FaceTime',instagram:'Instagram',notes:'메모',safari:'Safari',settings:'설정'})[name]||name;$('#headAction').textContent=name==='gallery'?'추가':name==='kakao'?'편집':'···';renderApp(name);}
function goHome(){state.app=null;state.chat=null;$('#appview').classList.remove('active');$('#home').classList.add('show');$('#viewer').style.display='none'}function headAction(){if(state.app==='gallery')$('#photoUpload').click();else if(state.app==='kakao')toast('대화 목록입니다. 인물을 선택하세요.');else toast('추가 기능');}
function renderApp(name){const c=$('#appContent');if(name==='kakao')renderKakao(c);else if(name==='phone')renderPhone(c);else if(name==='contacts')renderContacts(c);else if(name==='gallery')renderGallery(c);else if(name==='x')renderX(c);else if(name==='calendar')renderCalendar(c);else if(name==='camera')renderCamera(c);else if(name==='facetime')renderFace(c);else if(name==='instagram')renderInstagram(c);else if(name==='notes')renderNotes(c);else if(name==='safari')renderSafari(c);else if(name==='settings')renderSettings(c)}
function renderKakao(c){
 c.innerHTML='';
 if(state.chat){renderChatRoom(c,state.chat);return}
 const shell=document.createElement('div');shell.className='kakao-shell';
 shell.innerHTML=`<div class="kakao-top"><span class="kakao-title">채팅</span><button aria-label="검색" onclick="toast('채팅 검색')">⌕</button><button aria-label="새 채팅" onclick="toast('새 채팅')">＋</button><button aria-label="설정" onclick="toast('카카오톡 설정')">⚙</button></div><div class="kakao-filter"><span>전체</span><span>안읽음</span><span>☷</span></div><div class="kakao-list" id="kakaoList"></div><div class="kakao-bottom"><button onclick="toast('친구')">●<small>친구</small></button><button class="selected">●<small>채팅</small></button><button onclick="openApp('phone')">☎<small>통화</small></button><button onclick="toast('더보기')">•••<small>더보기</small></button></div>`;
 const list=shell.querySelector('#kakaoList');
 ['율리아 체링겐','나르케 파르네세','뮐러','엘리아스 호엔촐레른'].forEach(n=>{
  const b=document.createElement('button');b.className='kakao-row';
  let preview=n==='율리아 체링겐'?'ㅋㅋㅋㅋ 뭘 의도하는지 알겠네~ 나한테 맡겨봐.':n==='나르케 파르네세'?'안 되겠네~ 내가 네 방에서 자는 게 좋겠어.':n==='뮐러'?(state.mullerStarted?'저희 만날까요?':''):'그럼? 왜 저걸 지켜보겠다는 거야?';
  b.innerHTML=`${avatarMarkup(n)}<span class="chatinfo"><span class="chatname">${n}</span><div class="preview"></div></span><span class="time">${n==='뮐러'&&state.mullerStarted?'방금':''}${n==='뮐러'&&state.mullerStarted?'<span class="unread">3</span>':''}</span>`;
  b.querySelector('.preview').textContent=preview;
  b.onclick=()=>{if(n==='뮐러'&&!state.mullerStarted){state.mullerStarted=true;mullerTexts.forEach((t,i)=>setTimeout(()=>{chats['뮐러'].push(['other',t,nowTime()]);notice('뮐러',t);if(state.chat==='뮐러'&&$('#chatmessages'))addBubble($('#chatmessages'),'other',t,nowTime())},i*2000+2000))}state.chat=n;if(n==='나르케 파르네세')state.narUnread=0;renderKakao(c)};
  list.append(b);
 });
 c.append(shell);
}
function renderChatRoom(c,n){const bar=document.createElement('div');bar.className='profilebar';bar.innerHTML=`<button aria-label="채팅 목록으로" onclick="state.chat=null;renderKakao($('#appContent'))">‹</button>${avatarMarkup(n,'smallavatar')}<span class="pname">${n}</span>`;c.append(bar);const room=document.createElement('div');room.className='chatroom show';const messages=document.createElement('div');messages.className='chatmessages';messages.id='chatmessages';let arr=chats[n];arr.forEach(m=>addBubble(messages,m[0],m[1],m[2],m[3]===true));room.append(messages);const form=document.createElement('form');form.className='composer';form.innerHTML='<input id="chatinput" autocomplete="off" placeholder="메시지 입력"><button type="submit">➤</button>';form.onsubmit=e=>{e.preventDefault();let v=$('#chatinput').value.trim();if(!v)return;addBubble(messages,'me',v,new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),n==='나르케 파르네세');if(n==='나르케 파르네세')chats[n].push(['me',v,nowTime(),true]);else chats[n].push(['me',v,nowTime()]);$('#chatinput').value='';messages.scrollTop=messages.scrollHeight;if(n==='나르케 파르네세')return;if(n==='율리아 체링겐'){let ans=/율리아.*(부탁|이런 게)|친한 척|의도/.test(v)?'아, 친구니까~':v.includes('고마워')?'뭘. 별 거 아닌데.':'하하. 그래.';setTimeout(()=>addBubble(messages,'other',ans,nowTime()),3000)}else if(n==='뮐러'){['지금 답장해준 거예요?','역시 제 진심이 당신에게 닿았네요.','저희 만날까요?'].forEach((t,i)=>setTimeout(()=>addBubble(messages,'other',t,nowTime()),(i+1)*2000))}else if(n==='엘리아스 호엔촐레른'){let lower=v.toLowerCase();if(v.includes('첫째로, 죄질이 약해'))setTimeout(()=>addBubble(messages,'other','…그럴 건수가 없긴 하네. 사실 생각해 보면 장갑 절도범도 그렇게 진지하게 찾아 줄 것 같지가 않아. 나르케의 예지를 말해 준다면 괜히 황실에서 나르케를 데리고 가서 어떻게 정보를 더 얻을 수 없는지 심문하려 들 것 같고.',nowTime()),5000);else if(v.includes('바보'))setTimeout(()=>addBubble(messages,'other','뭐어?! 바보라니!',nowTime()),3000);else if(v.includes('뭐야?'))setTimeout(()=>addBubble(messages,'other','뭐가?',nowTime()),3000);else if(v.includes('사랑해')||v.includes('좋아해')){setTimeout(()=>addBubble(messages,'other','우어어어엉….',nowTime()),3000);setTimeout(()=>addBubble(messages,'other','감동이야!',nowTime()),5000)}else setTimeout(()=>addBubble(messages,'other','?ㅋㅋㅋㅋ 루카 그럼 고생하고~~',nowTime()),3000)}};room.append(form);c.append(room);setTimeout(()=>messages.scrollTop=messages.scrollHeight,20)}
function nowTime(){return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}function addBubble(box,who,text,time,unread=false){const row=document.createElement('div');row.className='msg '+(who==='me'?'me':'other');row.innerHTML=`${unread?'<span class="readmark">1</span>':''}<div class="bubble"></div><span class="msgtime">${time||''}</span>`;row.querySelector('.bubble').textContent=text;box.append(row);box.scrollTop=box.scrollHeight}
function notice(name,text){const n=document.createElement('div');n.className='notice';n.innerHTML=`<strong>●　${name}</strong><small>지금</small><p></p>`;n.querySelector('p').textContent=text;document.querySelector('.screen').append(n);let startY=0;n.addEventListener('touchstart',e=>startY=e.touches[0].clientY);n.addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>25)n.remove()});n.addEventListener('click',()=>n.remove());setTimeout(()=>{if(n.isConnected)n.remove()},6500)}
function renderPhone(c){c.innerHTML='<div class="simplelist"><h3>최근 통화</h3></div>';const list=c.firstChild;for(let i=0;i<30;i++)list.insertAdjacentHTML('beforeend',`<div class="callrow"><span class="red">↙</span>${avatarMarkup('뮐러')}<span class="details"><b class="red">뮐러</b><small>수신 전화 · 부재중</small></span><small>${i===0?'오늘':'어제'}</small></div>`);list.insertAdjacentHTML('beforeend',`<div class="callrow"><span class="red">↙</span>${avatarMarkup('엘리아스 호엔촐레른')}<span class="details"><b>엘리아스 호엔촐레른</b><small>수신 전화 · 부재중</small></span><small>어제</small></div><div class="callrow"><span class="green">↗</span>${avatarMarkup('엘리아스 호엔촐레른')}<span class="details"><b>엘리아스 호엔촐레른</b><small>발신 전화 · 통화 완료</small></span><small>어제</small></div>`)}
function renderContacts(c){c.innerHTML='<div class="simplelist"><h3>연락처</h3></div>';people.forEach(n=>c.firstChild.insertAdjacentHTML('beforeend',`<div class="simpleitem"><span><b>${n}</b><br><small>휴대전화</small></span><button onclick="toast('${n}에게 전화 거는 중…')">통화</button></div>`))}
function renderGallery(c){if(!state.photos.length)state.photos=['gallery-01.jpeg','gallery-02.jpeg','gallery-03.jpeg','gallery-04.jpeg','gallery-05.jpeg'].filter(name=>asset(name)).map((name,i)=>({url:asset(name),name:`사진 ${i+1}`}));c.innerHTML='<div class="gallerytools"><span>최근 항목</span><button class="primary" onclick="$(\'#photoUpload\').click()">사진 추가</button><input id="photoUpload" type="file" accept="image/*" multiple hidden></div><div class="mutedtext">제공된 사진 5장이 미리 들어 있습니다. ‘사진 추가’는 현재 브라우저에서 임시로 표시됩니다.</div><div class="gallerygrid" id="gallerygrid"></div>';const input=$('#photoUpload');input.onchange=()=>{Array.from(input.files).forEach(f=>{const url=URL.createObjectURL(f);state.photos.push({url,name:f.name});});drawPhotos()};drawPhotos()}
function drawPhotos(){const g=$('#gallerygrid');if(!g)return;g.innerHTML='';if(!state.photos.length){g.innerHTML='<div class="photo-placeholder">사진 없음<br>사진 추가를 눌러 선택</div><div class="photo-placeholder">GitHub images/ 폴더에<br>직접 업로드 가능</div><div class="photo-placeholder">사진을 선택하면<br>여기에 표시됩니다</div>';return}state.photos.forEach((p,i)=>{const im=document.createElement('img');im.src=p.url;im.alt=p.name;im.onclick=()=>{ $('#viewerImg').src=p.url;$('#viewer').style.display='flex'};g.append(im)})}function closeViewer(){$('#viewer').style.display='none'}
function renderX(c){if(!state.tweets.length)state.tweets=[{name:'황실 마법사 연합회',handle:'@ImperialMages',time:'8시간',text:'[공식 안내] 황실 마법사 연합회 101기 소속 일원에 대한 지속적인 스토킹 행위가 확인되었습니다. 해당 행위는 당사자의 안전과 업무 수행을 침해할 수 있으므로 즉시 중단할 것을 엄중히 경고합니다. 관련 제보는 공식 창구를 통해 접수해 주시기 바랍니다.',views:'800만',likes:'5만',rt:'6만'},{name:'마법사 소식통',handle:'@magic_daily',time:'2시간',text:'오늘 중앙 광장에서 열린 마력 안정화 시연, 예상보다 훨씬 많은 인파가 몰렸습니다. 현장 통제에 협조해 주신 시민 여러분께 감사드립니다.',views:'24만',likes:'1.2만',rt:'8,430'},{name:'익명의 관측자',handle:'@north_archive',time:'1시간',text:'요즘 황궁 주변 경비가 눈에 띄게 늘어난 것 같은데, 다들 무슨 일인지 들은 거 있나요?',views:'9.8만',likes:'3,201',rt:'1,029'}];c.innerHTML='<div class="tweetcompose"><span class="avatar">루</span><textarea id="tweetText" placeholder="무슨 일이 일어나고 있나요?"></textarea><button class="primary" onclick="postTweet()">게시</button></div><div id="tweetlist"></div>';const av=c.querySelector('.tweetcompose .avatar');if(av)av.outerHTML=avatarMarkup('루카스 아스카니엔');drawTweets()}
function drawTweets(){const l=$('#tweetlist');if(!l)return;l.innerHTML='';state.tweets.forEach((t,i)=>{if(typeof t.liked==='undefined')t.liked=false;const el=document.createElement('article');el.className='tweet';el.innerHTML=`<div class="tweethead">${avatarMarkup(t.name)}<div><strong>${t.name}</strong> <span class="handle">${t.handle} · ${t.time}</span></div></div><p></p><div class="metrics"><span onclick="toast('답글 기능')">♡　${t.likes}</span><span onclick="t.rt=String(Number((t.rt||'0').replace(/\D/g,''))+1);drawTweets()">↻　${t.rt}</span><span>◉　${t.views}</span><button class="likebtn ${t.liked?'liked':''}" aria-label="좋아요" aria-pressed="${t.liked?'true':'false'}" onclick="toggleLike(${i})"><span>${t.liked?'♥':'♡'}</span></button></div>`;el.querySelector('p').textContent=t.text;l.append(el)})}
function toggleLike(i){const t=state.tweets[i];if(!t)return;t.liked=!t.liked;drawTweets()}
function postTweet(){const ta=$('#tweetText'),v=ta.value.trim();if(!v)return;const own={name:'루카스 아스카니엔',handle:'@lucas_askanien',time:'방금',text:v,views:'0',likes:'0',rt:'0',liked:false};state.tweets.unshift(own);ta.value='';drawTweets();$('#appContent').scrollTop=0;toast('게시물이 게시되었습니다.');for(let step=1;step<=25;step++){setTimeout(()=>{own.likes=String(Math.round(50000*step/25));own.views=String(Math.round(800000*step/25));own.rt=String(Math.round(100000*step/25));if(step===25){own.likes='5만';own.views='80만';own.rt='10만'}drawTweets()},step*200)}}
function renderCalendar(c){c.innerHTML='<div style="padding:18px;background:white"><div style="color:#ef4545;font-size:13px">2026년 10월</div><h2>10월</h2><div class="calgrid" id="calgrid"></div></div><div class="simplelist"><div class="simpleitem"><span><b>오늘</b><br><small>수사 일정 확인</small></span><span>종일</span></div><div class="simpleitem"><span><b>전략회의</b><br><small>황실 마법사 연합회</small></span><span>16:00</span></div><button class="primary" onclick="toast(&quot;새로운 일정 추가&quot;)">＋ 일정 추가</button></div>';let g=$('#calgrid');['일','월','화','수','목','금','토'].forEach(d=>g.insertAdjacentHTML('beforeend',`<div style="font-weight:700;color:#888">${d}</div>`));for(let i=1;i<=31;i++)g.insertAdjacentHTML('beforeend',`<div class="${i===24?'today':''}">${i}</div>`)}
function renderCamera(c){c.innerHTML='<div class="cameraarea"><div><div style="font-size:44px">▣</div><p>카메라 미리보기</p><small>웹사이트에서는 실제 카메라와 동일한 촬영 기능이 제한될 수 있습니다.</small><br><button onclick="toast(\'카메라 기능은 브라우저 권한이 필요합니다.\')"></button><p>촬영</p></div></div>'}
function renderFace(c){c.innerHTML='<div class="simplelist"><h3>FaceTime</h3><div class="simpleitem"><span>율리아 체링겐</span><button onclick="toast(\'FaceTime 연결을 시도합니다.\')">영상 통화</button></div><div class="simpleitem"><span>나르케 파르네세</span><button onclick="toast(\'FaceTime 연결을 시도합니다.\')">영상 통화</button></div><div class="simpleitem"><span>엘리아스 호엔촐레른</span><button onclick="toast(\'FaceTime 연결을 시도합니다.\')">영상 통화</button></div></div>'}
function renderInstagram(c){c.innerHTML='<div class="simplelist"><h3>Instagram</h3><div class="tweet"><div class="tweethead"><span class="avatar">루</span><strong>루카스 아스카니엔</strong></div><p>오늘도 평온한 하루가 되기를.</p><div style="height:180px;background:linear-gradient(135deg,#d6d9e5,#8c95ad,#ddd0c9);border-radius:8px"></div><p>♡　좋아요　　댓글 달기</p></div><div class="simpleitem">스토리　<span>＋</span></div><div class="mutedtext">게시물에 댓글을 남길 수 있는 데모 화면입니다.</div><input placeholder="댓글 입력" style="margin:10px;padding:12px;width:90%;border:1px solid #ddd;border-radius:10px" onkeydown="if(event.key===&quot;Enter&quot;){toast(&quot;댓글이 추가되었습니다.&quot;);this.value=&quot;&quot;}"></div>';const av=c.querySelector('.tweethead .avatar');if(av)av.outerHTML=avatarMarkup('루카스 아스카니엔')}
function renderNotes(c){c.innerHTML='<div style="background:#fff;min-height:100%;padding:22px 20px;color:#171821"><div style="font-size:12px;color:#9296a0;margin-bottom:24px">모든 iCloud　　•••</div><h2 style="font-size:26px;margin:0 0 22px">오늘의 메모</h2><div style="font-size:16px;line-height:1.8"><label style="display:flex;gap:10px;align-items:flex-start;margin:10px 0"><input type="checkbox" checked style="width:18px;height:18px;margin-top:5px;accent-color:#e4b326"><span>1. 레오랑 대련.<br><small style="color:#666">ㄴ 요즘 율리아랑만 있어서 섭섭한듯. 슬슬 대련할 때가 됨.</small></span></label><label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" checked style="width:18px;height:18px;margin-top:5px;accent-color:#e4b326"><span>2. 율리아에게 친한 척 해달라 말하기.</span></label><label style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" style="width:18px;height:18px;margin-top:5px;accent-color:#e4b326"><span>3. 스토커 관련 일 처리.</span></label></div></div>'}function renderSafari(c){c.innerHTML='<div class="simplelist"><div style="display:flex;gap:5px"><input id="urlbar" value="https://" style="flex:1;padding:12px;border-radius:12px;border:1px solid #ddd"><button class="primary" onclick="toast(\'외부 웹페이지는 새 탭에서 열어주세요.\')">이동</button></div><h3 style="margin-top:30px">즐겨찾기</h3><div class="simpleitem">황실 마법사 연합회 <span>☆</span></div><div class="simpleitem">왕립 도서관 <span>☆</span></div></div>'}function lockPhone(){state.unlocked=false;pin='';$('#dots').textContent='○ ○ ○ ○';$('#lock').style.display='flex';$('#passpanel').style.display='none';goHome()}
function renderSettings(c){c.innerHTML='<div class="simplelist"><div class="simpleitem"><span>비밀번호</span><b>1018</b></div><div class="simpleitem"><span>배경화면</span><button onclick="toast(\'배경화면 설정은 데모 기능입니다.\')">변경</button></div><div class="simpleitem"><span>잠금</span><button onclick="lockPhone()">지금 잠그기</button></div><p class="mutedtext">이 웹사이트는 단일 HTML 기반의 인터랙티브 팬 프로젝트입니다. 실제 전화·메시지·FaceTime 통신은 연결되지 않습니다.</p></div>'}
renderApps();$('#passpanel').style.display='none';
</script></body></html>
